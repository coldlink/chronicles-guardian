services:
  quartz:
    env_file: ".env"
    build:
      context: .
      target: run
      args:
        - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
        - SERVICE_ACCOUNT=${SERVICE_ACCOUNT}
    ports:
      - 8081:8081
    environment:
      - DRIVE_FOLDER_ID=${DRIVE_FOLDER_ID}
      - SERVICE_ACCOUNT=${SERVICE_ACCOUNT}
